name: Build Remote Server

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            npm_arch: x64
            gulp_target: vscode-reh-linux-x64-min
          - os: ubuntu-24.04-arm
            arch: arm64
            npm_arch: arm64
            gulp_target: vscode-reh-linux-arm64-min

    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python3

      - name: Install dependencies
        env:
          npm_config_arch: ${{ matrix.npm_arch }}
          VSCODE_ARCH: ${{ matrix.arch }}
        run: npm ci

      - name: Build server
        env:
          npm_config_arch: ${{ matrix.npm_arch }}
          VSCODE_ARCH: ${{ matrix.arch }}
        run: npm run gulp ${{ matrix.gulp_target }}

      - name: Package server tarball
        run: |
          COMMIT=$(git rev-parse HEAD)
          cd ../vscode-reh-linux-${{ matrix.arch }}
          tar czf ../ephcode-server-linux-${{ matrix.arch }}-${COMMIT}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ephcode-server-linux-${{ matrix.arch }}
          path: ../ephcode-server-linux-${{ matrix.arch }}-*.tar.gz

      - name: Create/update release
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          TAG="server-${COMMIT}"
          ASSET="../ephcode-server-linux-${{ matrix.arch }}-${COMMIT}.tar.gz"

          # Create release if it doesn't exist
          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" \
              --title "Server build ${COMMIT:0:8}" \
              --notes "Automated server build for commit ${COMMIT}" \
              --prerelease

          # Upload asset
          gh release upload "$TAG" "$ASSET" --clobber
