name: Build Remote Server

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            npm_arch: x64
            gulp_target: vscode-reh-linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            npm_arch: arm64
            gulp_target: vscode-reh-linux-arm64

    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap configured:"
          free -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python3

      - name: Install dependencies
        env:
          npm_config_arch: ${{ matrix.npm_arch }}
          VSCODE_ARCH: ${{ matrix.arch }}
        run: npm ci

      - name: Build server
        env:
          npm_config_arch: ${{ matrix.npm_arch }}
          VSCODE_ARCH: ${{ matrix.arch }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run gulp ${{ matrix.gulp_target }}

      - name: Package server tarball
        run: |
          COMMIT=$(git rev-parse HEAD)
          cd ../vscode-reh-linux-${{ matrix.arch }}
          tar czf ${GITHUB_WORKSPACE}/ephcode-server-linux-${{ matrix.arch }}-${COMMIT}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ephcode-server-linux-${{ matrix.arch }}
          path: ephcode-server-linux-${{ matrix.arch }}-*.tar.gz

  release:
    needs: build-server
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          TAG="server-${COMMIT}"

          # Delete any existing release to avoid immutable upload errors
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          sleep 2

          # Collect all tarballs
          find artifacts -name "*.tar.gz" -exec mv {} . \;

          # Create release with all assets
          gh release create "$TAG" ephcode-server-*.tar.gz \
            --title "Server build ${COMMIT:0:8}" \
            --notes "Automated server build for commit ${COMMIT}" \
            --prerelease
